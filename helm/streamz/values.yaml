# Values for the Streamz backend Helm chart.

image:
  # Images are built per Dockerfile target (auth/video/purchase/streaming/webhook/gateway)
  # and published as ghcr.io/<org>/streamz/backend/<service>:<tag>.
  # Use the --target flag: docker build --target <service> -t <registry>/streamz/backend/<service>:<tag> .
  repository: ghcr.io/ogc16/streamz/backend
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

replicas: 1

# Per-service horizontal autoscaling (Kubernetes HPA / autoscaling/v2).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Resource requests/limits per service; falls back to `default`.
resources:
  default:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  gateway:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }
  streaming:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { cpu: "2", memory: 1Gi }
  purchase:
    requests: { cpu: 150m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

services:
  gateway:    { enabled: true,  port: 3000, target: gateway,    replicas: 2 }
  auth:       { enabled: true,  port: 4001, target: auth,       replicas: 2 }
  video:      { enabled: true,  port: 4002, target: video,      replicas: 2 }
  purchase:   { enabled: true,  port: 4003, target: purchase,   replicas: 2 }
  streaming:  { enabled: true,  port: 4004, target: streaming,  replicas: 3 }
  webhook:    { enabled: true,  port: 4005, target: webhook,    replicas: 1 }

# Default replica count when autoscaling is disabled (dev/CI).
replicas: 1

postgres:
  enabled: true
  image: postgres:16-alpine
  port: "5432"
  db: streamz
  user: streamz
  # Override in production (values override or sealed secret)
  password: streamz_secret
  storage: 10Gi

redis:
  enabled: true
  image: redis:7-alpine

pgbouncer:
  enabled: false

service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: streamz.example.com

# Sensitive config. Provide in production via `--set secret.JWT_SECRET=...`
# or a values override that sources from a secret store.
secret:
  JWT_SECRET: change-me
  JWT_REFRESH_SECRET: change-me
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  MUX_TOKEN_ID: ""
  MUX_TOKEN_SECRET: ""
  MUX_WEBHOOK_SECRET: ""
  MUX_SIGNING_KEY: ""
  MUX_PRIVATE_KEY: ""

config:
  STRIPE_CURRENCY: usd
  PLAYBACK_TTL_SECONDS: "3600"
  CORS_ORIGIN: "*"